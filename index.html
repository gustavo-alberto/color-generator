<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Generate random colors and copy them as HEX or RGB. Runs entirely in your browser." />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
    <title>Color Generator</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Runs before first paint so the saved theme never flashes. -->
    <script src="js/theme-init.js"></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true">
          <rect width="16" height="16" rx="3" class="brand-mark-bg" />
          <rect x="3" y="3" width="10" height="3" rx="0.5" class="brand-mark-1" />
          <rect x="3" y="6.5" width="10" height="3" rx="0.5" class="brand-mark-2" />
          <rect x="3" y="10" width="10" height="3" rx="0.5" class="brand-mark-3" />
        </svg>
        <h1 class="brand-name">color<span class="visually-hidden"> · Color Generator</span></h1>
      </div>

      <div class="header-actions">
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
        <a
          class="icon-btn"
          href="https://github.com/gustavo-alberto/color-generator"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Source code on GitHub (opens in a new tab)"
          title="Source code on GitHub"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 6l-6 6 6 6M16 6l6 6-6 6" />
          </svg>
        </a>
      </div>
    </header>

    <main class="workspace" id="main" tabindex="-1">
      <section class="stage" aria-labelledby="preview-title">
        <h2 class="visually-hidden" id="preview-title">Preview</h2>
        <div class="swatch-card">
          <span class="crop crop-tl" aria-hidden="true"></span>
          <span class="crop crop-tr" aria-hidden="true"></span>
          <span class="crop crop-bl" aria-hidden="true"></span>
          <span class="crop crop-br" aria-hidden="true"></span>
          <div class="swatch" id="swatch" role="img" aria-label="Color preview"></div>
        </div>
        <p class="swatch-caption" id="swatch-caption" translate="no">—</p>
      </section>

      <section class="block values" aria-labelledby="values-title">
        <h2 class="block-title" id="values-title">
          <span class="block-index">01</span>
          <span>Values</span>
        </h2>

        <div class="value-row">
          <span class="value-label" id="hex-label">HEX</span>
          <output class="value-field" id="hex-value" aria-labelledby="hex-label" aria-live="off" translate="no">—</output>
          <button type="button" class="btn btn-secondary copy-btn" data-copy="hex" aria-label="Copy HEX value">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="12" height="12" rx="2" />
              <path d="M5 15V5a2 2 0 0 1 2-2h10" />
            </svg>
            <span>Copy</span>
          </button>
        </div>

        <div class="value-row">
          <span class="value-label" id="rgb-label">RGB</span>
          <div class="value-field rgb-field" role="group" aria-labelledby="rgb-label" translate="no">
            <span class="rgb-channel"><span class="rgb-channel-name">R</span><span id="rgb-r">—</span></span>
            <span class="rgb-channel"><span class="rgb-channel-name">G</span><span id="rgb-g">—</span></span>
            <span class="rgb-channel"><span class="rgb-channel-name">B</span><span id="rgb-b">—</span></span>
          </div>
          <button type="button" class="btn btn-secondary copy-btn" data-copy="rgb" aria-label="Copy RGB value as CSS">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="12" height="12" rx="2" />
              <path d="M5 15V5a2 2 0 0 1 2-2h10" />
            </svg>
            <span>Copy</span>
          </button>
        </div>

        <p class="block-note">RGB copies as CSS: <code id="rgb-css" translate="no">rgb(0 0 0)</code></p>

        <div class="action-bar">
          <button type="button" class="btn btn-primary generate-btn" id="generate-btn">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
            </svg>
            <span>New color</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Runs in your browser. Nothing is sent.</span>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <p class="visually-hidden" id="announcer" aria-live="polite"></p>
  </body>
</html>
